name: Send Telegram Messages

on:
  schedule:
    - cron: '0 5 * * *'
    - cron: '0 11 * * *'
    - cron: '0 19 * * *'
  workflow_dispatch:

jobs:
  send-message:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Send message
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          HOUR=$(date -u +"%H")

          if [ "$HOUR" = "05" ]; then
            node send.js morning
          elif [ "$HOUR" = "11" ]; then
            node send.js day
          elif [ "$HOUR" = "19" ]; then
            node send.js evening
          fi